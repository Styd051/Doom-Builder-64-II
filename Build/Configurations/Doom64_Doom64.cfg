/*************************************************************\
  Doom Builder 2 Game Configuration for Doom 64 (Doom64 EX)
\*************************************************************/

// This is required to prevent accidental use of a different configuration
type = "Doom Builder 2 Game Configuration";

// This is the title to show for this game
game = "Doom 64: Doom64 EX (Doom 64 format)";

// This is the simplified game engine/sourceport name
engine = "doom64";

// Should this configuration be initially available?
enabledbydefault = true;

// The format interface handles the map data format
formatinterface = "Doom64MapSetIO";

// Some common settings
include("Includes\\Common.cfg");

// Default lump name for new map
defaultlumpname = "MAP01";
basegame = "Doom";

// No DECORATE support in Doom 64
decorategames = "";

// Default testing parameters
testparameters = "-iwad \"%WP\" -skill \"%S\" -file \"%AP\" \"%F\" -warp %L1 %L2 %NM";
testshortpaths = true;

// Default nodebuilder configurations
defaultsavecompiler = "D64BSP_normal";
defaulttestcompiler = "D64BSP_normal";

// Skill levels
skills
{
	include("Includes\\Doom64_misc.cfg", "skills");
}

// Thing palettes (see palindex in the thing types)
thingpalettes
{
	include("Includes\\Doom64_misc.cfg", "thingpalettes");
}

// When this is set to true, sectors with the same tag will light up when a line is highlighted
linetagindicatesectors = true;

// Special linedefs
soundlinedefflag = 64;	// See linedefflags
singlesidedflag = 1;	// See linedefflags
doublesidedflag = 4;	// See linedefflags
impassableflag = 1;
blockmonsterflag = 2;
upperunpeggedflag = 8;
lowerunpeggedflag = 16;
secretflag = 32;
invisibleflag = 128;

// Default textures
defaultwalltexture = "SPACEAP";
defaultfloortexture = "SFLATA";
defaultceilingtexture = "SFLATA";

// Door making
makedoortrack = "STRACB";
makedooraction = 1;			// See linedeftypes

// Generalized actions
generalizedlinedefs = false;
generalizedsectors = false;

// Texture loading options
mixtexturesflats = true;
defaulttexturescale = 1.0f;
defaultflatscale = 1.0f;
scaledtextureoffsets = true;

// Do vanilla-style thing rotation angle clamping
doomthingrotationangles = true;

// Default flags for first new thing
defaultthingflags
{
	include("Includes\\Doom64_misc.cfg", "defaultthingflags");
}

// Texture sources
textures
{
	include("Includes\\Doom64_misc.cfg", "textures");
}

// Patch sources
patches
{
	include("Includes\\Doom64_misc.cfg", "patches");
}

// Sprite sources
sprites
{
	include("Includes\\Doom64_misc.cfg", "sprites");
}

// Flat sources
flats
{
	include("Includes\\Doom64_misc.cfg", "flats");
}

maplumpnames
{
	include("Includes\\Doom64_misc.cfg", "doommaplumpnames");
}

// Default sector brightness levels
sectorbrightness
{
	include("Includes\\Doom64_misc.cfg", "sectorbrightness");
}

// SECTOR TYPES
sectortypes
{
	include("Includes\\Doom64_sectors.cfg");
}

// LINEDEF FLAGS
linedefflags
{
	include("Includes\\Doom64_misc.cfg", "linedefflags");
}

// SECTOR FLAGS
sectorflags
{
	include("Includes\\Doom64_misc.cfg", "sectorflags");
}

// LINEDEF ACTIVATIONS
linedefactivations
{
}

// Linedef flags UDMF translation table
// This is needed for copy/paste and prefabs to work properly
// When the UDMF field name is prefixed with ! it is inverted
linedefflagstranslation
{
	include("Includes\\Doom64_misc.cfg", "linedefflagstranslation");
}

// LINEDEF TYPES
linedeftypes
{
	include("Includes\\Doom64_linedefs.cfg");
}

// THING FLAGS
thingflags
{
	include("Includes\\Doom64_misc.cfg", "thingflags");
}

// Thing flags UDMF translation table
// This is needed for copy/paste and prefabs to work properly
// When the UDMF field name is prefixed with ! it is inverted
thingflagstranslation
{
	include("Includes\\Doom64_misc.cfg", "thingflagstranslation");
}

// How to compare thing flags (for the stuck things error checker)
thingflagscompare
{
	include("Includes\\Doom64_misc.cfg", "thingflagscompare");
}

// Things flags masks
include("Includes\\Doom64_misc.cfg", "thingflagsmasks");

// THING TYPES
thingtypes
{
	include("Includes\\Doom64_things.cfg");
}

// Default thing filters
// (these are not required, just useful for new users)
thingsfilters
{
	include("Includes\\Doom64_misc.cfg", "thingsfilters");
}

// ENUMERATIONS
// These are enumerated lists for linedef types and UDMF fields.
enums
{
	include("Includes\\Doom64_misc.cfg", "enums");
}

// Default texture sets
// (these are not required, but useful for new users)
texturesets
{
	include("Includes\\Doom64_texturesets.cfg");
}
