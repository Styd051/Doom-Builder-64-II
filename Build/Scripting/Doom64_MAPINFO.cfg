/*******************************************************************\
	Doom Builder 64 II Script highlighting definitions for the MAPINFO of Doom 64
\*******************************************************************/

// Editor settings
description = "Doom64 MAPINFO";
codepage = 0;
extensions = "txt";
casesensitive = false;
codeblockopen = "{";
codeblockclose = "}";
insertcase = 1;	// 0=Normal, 1=Lowercase, 2=Uppercase
lexer = 35;	// CPP-style, case-insensitive
keywordhelp = "";
scripttype = "MAPINFO";

properties
{
	map;
	cluster;
	classtype;
	levelnum;
	exitdelay;
	music;
	compat_collision;
	allowjump;
	allowfreelook;
	pic;
	pic_x;
	pic_y;
	entertext;
	exittext;
}

constants
{
	nointermission;
	clearcheats;
	continuemusiconexit;
	forcegodmode;
	scrolltextend;
}
