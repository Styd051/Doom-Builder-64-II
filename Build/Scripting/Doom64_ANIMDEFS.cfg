/*******************************************************************\
	Doom Builder 64 II Script highlighting definitions for the ANIMDEFS of Doom 64
\*******************************************************************/

// Editor settings
description = "Doom64 ANIMDEFS";
codepage = 0;
extensions = "txt";
casesensitive = false;
codeblockopen = "{";
codeblockclose = "}";
insertcase = 1;	// 0=Normal, 1=Lowercase, 2=Uppercase
lexer = 35;	// CPP-style, case-insensitive
keywordhelp = "";
scripttype = "ANIMDEFS";

properties
{
	animpic;
	restartdelay;
	frames;
	speed;
}

constants
{
	rewind;
	cyclepalettes;
}
